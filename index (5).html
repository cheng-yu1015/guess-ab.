function randomAnswer() {
  const d = &#x27;0123456789&#x27;.split(&#x27;&#x27;);
  for (let i = d.length - 1; i &gt; 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  return d.slice(0, 4).join(&#x27;&#x27;);
}
function parseGuess(raw) {
  const t = String(raw).trim();
  if (!t) return {error: &#x27;請輸入四位數字。&#x27;};
  if (!/^\d+$/.test(t)) return {error: &#x27;只能輸入數字 0～9。&#x27;};

  if (new Set(t.split(&#x27;&#x27;)).size !== 4) return {error: &#x27;四個數字不能重複。&#x27;};
  return {value: t};
}

  let a = 0, b = 0;
  for (let i = 0; i &lt; 4; i++) {
    if (guess[i] === target[i]) a++;
    else if (target.indexOf(guess[i]) &gt;= 0) b++;

  input.value = &#x27;&#x27;; input.disabled = false; submit.disabled = false;

  debugBox.checked = false; updateDebug();
  showMessage(&#x27;準備好了！請猜一個四位數字。&#x27;);
  if (focusInput) input.focus();

  event.preventDefault();
  if (finished) return;
  const parsed = parseGuess(input.value);
  if (parsed.error) {
    showMessage(parsed.error, &#x27;error&#x27;);
    input.setAttribute(&#x27;aria-invalid&#x27;, &#x27;true&#x27;); input.focus(); return;

    finished = true;
    showMessage(&#x27;猜對了！答案就是 &#x27; + answer + &#x27;（4A0B）。&#x27;, &#x27;win&#x27;);
    input.disabled = true; submit.disabled = true; restart.focus();

    showMessage(parsed.value + &#x27;：&#x27; + r.a + &#x27;A&#x27; + r.b + &#x27;B&#x27;);
    input.focus(); input.select();
  }
});

restart.addEventListener(&#x27;click&#x27;, () =&gt; newGame());

  &lt;p class=&quot;note&quot;&gt;沒有帳號或存檔，紀錄只留在目前頁面，重新整理或關閉後會清空。未猜對就開新局，舊局會標示「未完成」，只能查看、不能續玩。&lt;/p&gt;
&lt;/main&gt;
&lt;script&gt;
&#x27;use strict&#x27;;
const $ = id =&gt; document.getElementById(id);
const form = $(&#x27;guess-form&#x27;), input = $(&#x27;guess&#x27;), submit = $(&#x27;submit&#x27;);
const feedback = $(&#x27;feedback&#x27;), restart = $(&#x27;restart&#x27;), debugBox = $(&#x27;debug&#x27;), debugAnswer = $(&#x27;debug-answer&#x27;);
const rounds = [];
let current = null;

function randomAnswer() {
  const d = &#x27;0123456789&#x27;.split(&#x27;&#x27;);
  for (let i = d.length - 1; i &gt; 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  return d.slice(0, 4).join(&#x27;&#x27;);
}
function parseGuess(raw) {
  const t = String(raw).trim();
  if (!t) return {error: &#x27;請輸入四位數字。&#x27;};
  if (!/^\d+$/.test(t)) return {error: &#x27;只能輸入數字 0～9。&#x27;};
  if (t.length !== 4) return {error: &#x27;必須剛好四位數字（可以 0 開頭，例如 0123）。&#x27;};
  if (new Set(t.split(&#x27;&#x27;)).size !== 4) return {error: &#x27;四個數字不能重複。&#x27;};
  return {value: t};
}
function score(guess, target) {
  let a = 0, b = 0;
  for (let i = 0; i &lt; 4; i++) {
    if (guess[i] === target[i]) a++;
    else if (target.indexOf(guess[i]) &gt;= 0) b++;
  }
  return {a, b};
}

function statusLabel(s) { return {playing: &#x27;進行中&#x27;, won: &#x27;已猜對&#x27;, unfinished: &#x27;未完成&#x27;}[s]; }
function showMessage(text, tone = &#x27;&#x27;) { feedback.textContent = text; feedback.dataset.tone = tone; }
function make(tag, text, className) {
  const el = document.createElement(tag);
  if (text !== undefined) el.textContent = text;
  if (className) el.className = className;
  return el;
}
function timeLabel(iso) { return new Date(iso).toLocaleString(&#x27;zh-TW&#x27;, {hour12: false}); }
function updateDebug() {
  debugAnswer.hidden = !debugBox.checked;
  if (debugBox.checked) debugAnswer.textContent = &#x27;除錯答案：&#x27; + current.answer;
}
function renderHistory(openId = null) {
  const expanded = new Set([...$(&#x27;history&#x27;).querySelectorAll(&#x27;details[open]&#x27;)].map(el =&gt; el.dataset.round));
  $(&#x27;history&#x27;).replaceChildren();
  $(&#x27;total&#x27;).textContent = &#x27;共 &#x27; + rounds.length + &#x27; 局&#x27;;
  $(&#x27;wins&#x27;).textContent = &#x27;猜對 &#x27; + rounds.filter(r =&gt; r.status === &#x27;won&#x27;).length + &#x27; 局&#x27;;
  [...rounds].reverse().forEach(round =&gt; {
    const details = make(&#x27;details&#x27;); details.dataset.round = String(round.id);
    details.open = round.id === openId || expanded.has(String(round.id));
    details.append(make(&#x27;summary&#x27;, &#x27;第 &#x27; + round.id + &#x27; 局 · &#x27; + statusLabel(round.status) + &#x27; · &#x27; + round.guesses.length + &#x27; 次猜測&#x27;));
    const content = make(&#x27;div&#x27;, undefined, &#x27;round-content&#x27;);
    content.append(make(&#x27;p&#x27;, &#x27;開始：&#x27; + timeLabel(round.startedAt), &#x27;round-meta&#x27;));
    if (round.endedAt) content.append(make(&#x27;p&#x27;, &#x27;結束：&#x27; + timeLabel(round.endedAt), &#x27;round-meta&#x27;));
    if (round.status === &#x27;won&#x27;) content.append(make(&#x27;p&#x27;, &#x27;答案：&#x27; + round.answer));
    if (!round.guesses.length) content.append(make(&#x27;p&#x27;, &#x27;這一局尚未猜測。&#x27;, &#x27;small&#x27;));
    else {
      const wrap = make(&#x27;div&#x27;, undefined, &#x27;table-wrap&#x27;), table = make(&#x27;table&#x27;);
      table.append(make(&#x27;caption&#x27;, &#x27;第 &#x27; + round.id + &#x27; 局的完整猜測歷程&#x27;));
      const head = make(&#x27;thead&#x27;), header = make(&#x27;tr&#x27;);
      [&#x27;次序&#x27;, &#x27;猜測&#x27;, &#x27;結果&#x27;, &#x27;時間&#x27;].forEach(l =&gt; { const th = make(&#x27;th&#x27;, l); th.scope = &#x27;col&#x27;; header.append(th); });
      head.append(header); table.append(head);
      const body = make(&#x27;tbody&#x27;);
      round.guesses.forEach(g =&gt; {
        const row = make(&#x27;tr&#x27;);
        [g.order, g.value, g.a + &#x27;A&#x27; + g.b + &#x27;B&#x27;, new Date(g.at).toLocaleTimeString(&#x27;zh-TW&#x27;, {hour12: false})].forEach(v =&gt; row.append(make(&#x27;td&#x27;, String(v))));
        body.append(row);
      });
      table.append(body); wrap.append(table); content.append(wrap);
    }
    details.append(content); $(&#x27;history&#x27;).append(details);
  });
}
function newGame(focusInput = true) {
  const now = new Date().toISOString();
  if (current &amp;&amp; current.status === &#x27;playing&#x27;) { current.status = &#x27;unfinished&#x27;; current.endedAt = now; }
  current = {id: rounds.length + 1, answer: randomAnswer(), status: &#x27;playing&#x27;, startedAt: now, endedAt: null, guesses: []};
  rounds.push(current);
  $(&#x27;round-title&#x27;).textContent = &#x27;第 &#x27; + current.id + &#x27; 局&#x27;;
  input.value = &#x27;&#x27;; input.disabled = false; submit.disabled = false;
  input.removeAttribute(&#x27;aria-invalid&#x27;);
  debugBox.checked = false; updateDebug();
  showMessage(&#x27;準備好了！請猜一個四位數字。&#x27;);
  renderHistory(current.id);
  if (focusInput) input.focus();
}
form.addEventListener(&#x27;submit&#x27;, event =&gt; {
  event.preventDefault();
  if (!current || current.status !== &#x27;playing&#x27;) return;
  const parsed = parseGuess(input.value);
  if (parsed.error) {
    showMessage(parsed.error + &#x27;這次不列入猜測紀錄。&#x27;, &#x27;error&#x27;);
    input.setAttribute(&#x27;aria-invalid&#x27;, &#x27;true&#x27;); input.focus(); return;
  }
  input.removeAttribute(&#x27;aria-invalid&#x27;);
  const r = score(parsed.value, current.answer), now = new Date().toISOString();
  current.guesses.push({order: current.guesses.length + 1, value: parsed.value, a: r.a, b: r.b, at: now});
  if (r.a === 4) {
    current.status = &#x27;won&#x27;; current.endedAt = now;
    showMessage(&#x27;猜對了！答案就是 &#x27; + current.answer + &#x27;，共猜了 &#x27; + current.guesses.length + &#x27; 次。&#x27;, &#x27;win&#x27;);
    input.disabled = true; submit.disabled = true; restart.focus();
  } else {
    showMessage(parsed.value + &#x27;：&#x27; + r.a + &#x27;A&#x27; + r.b + &#x27;B&#x27;);
    input.focus(); input.select();
  }
  renderHistory(current.id);
});
debugBox.addEventListener(&#x27;change&#x27;, updateDebug);
restart.addEventListener(&#x27;click&#x27;, () =&gt; newGame());
newGame(false);

&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
" hidden></iframe>
  <section id="cloud" class="cloud" hidden>
    <h2 id="cloud-title"></h2>
    <p id="cloud-desc"></p>
    <p class="warn">GitHub Pages 只能放靜態網頁；雲端存檔要靠 Google Apps Script。部署方式見 README，部署後把 <code>/exec</code> 網址貼在下面（只存在你自己的瀏覽器）。</p>
    <label for="exec-url">/exec 網址</label>
    <input id="exec-url" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <a id="direct-link" class="go" href="#" target="_blank" rel="noopener noreferrer">開啟雲端版 ↗</a>
    <button id="open-exec" type="button">儲存網址並開啟</button>
  </section>
</div>
<script>
'use strict';
(function () {
  // 部署好 GAS 後，可把 /exec 網址填在這裡，GitHub 上的訪客就能直接點開：
  var DEFAULT_URLS = {v3: 'https://script.google.com/macros/s/AKfycbwkm1ieookKN2skijQOBblQ41yS6bp9pNyLGokCGX6hPXJM_HeArXipO9rRq2tNlYAH/exec', v4: 'https://script.google.com/macros/s/AKfycbyEySWEZT7Di9grXMGobUdTFbl-1YP8bM-vXA2JoGFkXfUfcXSGTHNMWuLVQqu9EWdG1Q/exec'};
  var info = {
    v3: ['版本三：代號雲端存檔', '輸入代號，每次有效猜測自動存進製作者的 Google 試算表；同代號可讀回與續玩。部署時執行身分選「我」。'],
    v4: ['版本四：Google 個人存檔', '每位玩家用自己的 Google 帳號授權，確認後建立自己的試算表。部署時執行身分選「存取網頁應用程式的使用者」，不用 setup。']
  };
  var frames = {v1: document.getElementById('f-v1'), v2: document.getElementById('f-v2')};
  var tabs = document.querySelectorAll('nav button'), input = document.getElementById('exec-url');
  var active = 'v1';
  function store(key, val) { try { if (val === undefined) return localStorage.getItem(key) || ''; localStorage.setItem(key, val); } catch (e) { return ''; } return ''; }
  function fit(f) { try { var h = f.contentDocument.documentElement.scrollHeight; if (h > 0) f.style.height = (h + 4) + 'px'; } catch (e) {} }
  function show(id) {
    if (!frames[id] && !info[id]) id = 'v1';
    active = id;
    Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== id; });
    tabs.forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.v === id)); });
    var cloud = !!info[id];
    document.getElementById('cloud').hidden = !cloud;
    if (cloud) {
      document.getElementById('cloud-title').textContent = info[id][0];
      document.getElementById('cloud-desc').textContent = info[id][1];
      input.value = DEFAULT_URLS[id] || store('exec-' + id);
      document.getElementById('direct-link').href = input.value || '#';
    }
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    if (frames[id]) fit(frames[id]);
  }
  tabs.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.v); }); });
  setInterval(function () { if (frames[active]) fit(frames[active]); }, 300);
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  document.getElementById('open-exec').addEventListener('click', function () {
    var url = input.value.trim();
    if (/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(url)) { store('exec-' + active, url); window.open(url, '_blank', 'noopener'); }
    else alert('請貼上以 https://script.google.com/macros/s/ 開頭、以 /exec 結尾的網址。');
  });
  input.addEventListener('input', function () { document.getElementById('direct-link').href = input.value.trim() || '#'; });
  show(location.hash.slice(1) || 'v1');
})();
</script>
