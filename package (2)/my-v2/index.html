<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幾A幾B｜版本二</title>
<style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#23443d;background:#f4f2e9;line-height:1.7}
*{box-sizing:border-box}
body{margin:0;padding:28px 16px;display:flex;justify-content:center}
main{width:min(100%,1100px)}
.eyebrow{margin:0 0 8px;font-size:13px;letter-spacing:.12em;color:#576b5f}
h1{font-size:clamp(32px,7vw,46px);line-height:1.25;margin:0 0 14px}
.intro{margin:0 0 24px;color:#50645b}
.card{padding:clamp(24px,5vw,38px);background:#fff;border:1px solid #d1dcd1;border-radius:26px;box-shadow:0 16px 50px #274b3e0a}
label{display:block;font-weight:650;margin-bottom:10px}
input{width:100%;font:700 36px/1.4 system-ui;text-align:center;padding:14px;border:2px solid #a3b9ac;border-radius:14px;color:#23443d;background:#fbfcf8}
input::placeholder{color:#9ba69e;font-weight:400}
#guess{letter-spacing:.3em}
#guess::placeholder{letter-spacing:.1em}
button{font:inherit;font-weight:650;border-radius:12px;padding:13px 18px;cursor:pointer;min-height:50px}
.submit{width:100%;margin-top:14px;border:1px solid #315e4f;background:#315e4f;color:white}
.reset{border:1px solid #a6b9ab;color:#315e4f;background:transparent}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid #a86731;outline-offset:4px}
#feedback{display:flex;align-items:center;justify-content:center;text-align:center;min-height:94px;border-radius:14px;background:#edf2eb;padding:18px;margin:18px 0;color:#355a4b;font-size:20px;font-weight:650}
#feedback[data-tone=error]{background:#f8e9e1;color:#853b29}
#feedback[data-tone=win]{background:#dcebd7;color:#28512a}
.footer{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note{font-size:13px;color:#5b6b61;margin:22px 4px 0}
.small{font-size:14px;color:#5b6b61}
.rules{margin:0 0 16px;padding:12px 16px;border-radius:12px;background:#edf2eb;font-size:14px;color:#476251}
.debug{display:flex;gap:10px;align-items:center;margin:16px 0 0;font-weight:650;cursor:pointer}
.debug input{width:22px;height:22px;min-height:0;margin:0;padding:0;font-size:16px;letter-spacing:0}
.debugbox{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:#fff4d6;color:#6b4a0b;font-weight:700;font-size:20px}
.debugbox[hidden]{display:none}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}.submit:hover:not(:disabled){background:#244d40}}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
h2{margin:0 0 14px;font-size:22px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px;color:#476251}
details{border:1px solid #d1dcd1;border-radius:14px;margin:12px 0;background:#fbfcf8;overflow:hidden}
summary{padding:15px;cursor:pointer;font-weight:650}
.round-content{padding:0 15px 15px}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:15px;text-align:left}
caption{text-align:left;padding-bottom:8px;font-size:14px;color:#5b6b61}
th,td{padding:9px 8px;border-bottom:1px solid #dce5da;white-space:nowrap}
th{font-weight:650;background:#edf2eb}
.round-meta{font-size:13px;color:#5b6b61}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
[hidden]{display:none!important}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
.status{padding:14px 18px;border:1px solid #c9d7ce;border-radius:14px;background:#e8f1e8;min-height:56px;margin:18px 0}
.status[data-tone=error]{background:#f8e9e1;color:#853b29}
.status[data-tone=busy]{background:#edf0f4;color:#3b5260}
#code{font-size:24px;text-align:left;letter-spacing:0}
.gate{max-width:620px;margin:24px auto}
.tag{padding:6px 12px;border-radius:8px;background:#e7ede4;font-size:14px;display:inline-block}
.resume{margin:12px 0;font-size:14px}
.notice{padding:16px;background:#eeeade;border-radius:12px;font-size:14px;color:#5d5447}
.status-actions{display:flex;gap:10px;flex-wrap:wrap}
.empty{padding:20px 0;color:#5b6b61}
</style>
</head>
<body>
<main>
  <p class="eyebrow">數位科技概論 · 版本二</p>
  <h1>幾 A 幾 B</h1>
  <p class="intro">電腦想好了 4 個不重複的數字。每一局的猜測都會留在右邊的歷史裡。</p>
  <div class="stats"><span id="total">共 1 局</span><span id="wins">猜對 0 局</span></div>
  <div class="layout">
    <section class="card" aria-label="幾 A 幾 B 遊戲">
      <h2 id="round-title">第 1 局</h2>
      <p class="rules">答案是 4 個「不重複」的數字，可以 0 開頭（例如 0123）。<b>A</b>＝數字與位置都對；<b>B</b>＝數字對、位置不同。4A0B 就過關。</p>
      <form id="guess-form" novalidate>
        <label for="guess">你猜的四位數字</label>
        <input id="guess" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="例如 0123" aria-describedby="feedback">
        <button class="submit" id="submit" type="submit">猜看看</button>
      </form>
      <label class="debug"><input type="checkbox" id="debug"> 除錯模式（顯示這一局的答案）</label>
      <p id="debug-answer" class="debugbox" hidden></p>
      <p id="feedback" role="status" aria-live="polite" aria-atomic="true">準備好了！請猜一個四位數字。</p>
      <div class="footer"><button class="reset" id="restart" type="button">開新局（保留紀錄）</button><span class="small">也可以按 Enter 送出</span></div>
    </section>
    <section class="card" aria-labelledby="history-title">
      <h2 id="history-title">遊玩歷史</h2>
      <p class="small">每一局各自保留猜測次序、結果與時間。點選標題可以展開或收合。</p>
      <div id="history"></div>
    </section>
  </div>
  <p class="note">沒有帳號或存檔，紀錄只留在目前頁面，重新整理或關閉後會清空。未猜對就開新局，舊局會標示「未完成」，只能查看、不能續玩。</p>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const form = $('guess-form'), input = $('guess'), submit = $('submit');
const feedback = $('feedback'), restart = $('restart'), debugBox = $('debug'), debugAnswer = $('debug-answer');
const rounds = [];
let current = null;

function randomAnswer() {
  const d = '0123456789'.split('');
  for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  return d.slice(0, 4).join('');
}
function parseGuess(raw) {
  const t = String(raw).trim();
  if (!t) return {error: '請輸入四位數字。'};
  if (!/^\d+$/.test(t)) return {error: '只能輸入數字 0～9。'};
  if (t.length !== 4) return {error: '必須剛好四位數字（可以 0 開頭，例如 0123）。'};
  if (new Set(t.split('')).size !== 4) return {error: '四個數字不能重複。'};
  return {value: t};
}
function score(guess, target) {
  let a = 0, b = 0;
  for (let i = 0; i < 4; i++) {
    if (guess[i] === target[i]) a++;
    else if (target.indexOf(guess[i]) >= 0) b++;
  }
  return {a, b};
}

function statusLabel(s) { return {playing: '進行中', won: '已猜對', unfinished: '未完成'}[s]; }
function showMessage(text, tone = '') { feedback.textContent = text; feedback.dataset.tone = tone; }
function make(tag, text, className) {
  const el = document.createElement(tag);
  if (text !== undefined) el.textContent = text;
  if (className) el.className = className;
  return el;
}
function timeLabel(iso) { return new Date(iso).toLocaleString('zh-TW', {hour12: false}); }
function updateDebug() {
  debugAnswer.hidden = !debugBox.checked;
  if (debugBox.checked) debugAnswer.textContent = '除錯答案：' + current.answer;
}
function renderHistory(openId = null) {
  const expanded = new Set([...$('history').querySelectorAll('details[open]')].map(el => el.dataset.round));
  $('history').replaceChildren();
  $('total').textContent = '共 ' + rounds.length + ' 局';
  $('wins').textContent = '猜對 ' + rounds.filter(r => r.status === 'won').length + ' 局';
  [...rounds].reverse().forEach(round => {
    const details = make('details'); details.dataset.round = String(round.id);
    details.open = round.id === openId || expanded.has(String(round.id));
    details.append(make('summary', '第 ' + round.id + ' 局 · ' + statusLabel(round.status) + ' · ' + round.guesses.length + ' 次猜測'));
    const content = make('div', undefined, 'round-content');
    content.append(make('p', '開始：' + timeLabel(round.startedAt), 'round-meta'));
    if (round.endedAt) content.append(make('p', '結束：' + timeLabel(round.endedAt), 'round-meta'));
    if (round.status === 'won') content.append(make('p', '答案：' + round.answer));
    if (!round.guesses.length) content.append(make('p', '這一局尚未猜測。', 'small'));
    else {
      const wrap = make('div', undefined, 'table-wrap'), table = make('table');
      table.append(make('caption', '第 ' + round.id + ' 局的完整猜測歷程'));
      const head = make('thead'), header = make('tr');
      ['次序', '猜測', '結果', '時間'].forEach(l => { const th = make('th', l); th.scope = 'col'; header.append(th); });
      head.append(header); table.append(head);
      const body = make('tbody');
      round.guesses.forEach(g => {
        const row = make('tr');
        [g.order, g.value, g.a + 'A' + g.b + 'B', new Date(g.at).toLocaleTimeString('zh-TW', {hour12: false})].forEach(v => row.append(make('td', String(v))));
        body.append(row);
      });
      table.append(body); wrap.append(table); content.append(wrap);
    }
    details.append(content); $('history').append(details);
  });
}
function newGame(focusInput = true) {
  const now = new Date().toISOString();
  if (current && current.status === 'playing') { current.status = 'unfinished'; current.endedAt = now; }
  current = {id: rounds.length + 1, answer: randomAnswer(), status: 'playing', startedAt: now, endedAt: null, guesses: []};
  rounds.push(current);
  $('round-title').textContent = '第 ' + current.id + ' 局';
  input.value = ''; input.disabled = false; submit.disabled = false;
  input.removeAttribute('aria-invalid');
  debugBox.checked = false; updateDebug();
  showMessage('準備好了！請猜一個四位數字。');
  renderHistory(current.id);
  if (focusInput) input.focus();
}
form.addEventListener('submit', event => {
  event.preventDefault();
  if (!current || current.status !== 'playing') return;
  const parsed = parseGuess(input.value);
  if (parsed.error) {
    showMessage(parsed.error + '這次不列入猜測紀錄。', 'error');
    input.setAttribute('aria-invalid', 'true'); input.focus(); return;
  }
  input.removeAttribute('aria-invalid');
  const r = score(parsed.value, current.answer), now = new Date().toISOString();
  current.guesses.push({order: current.guesses.length + 1, value: parsed.value, a: r.a, b: r.b, at: now});
  if (r.a === 4) {
    current.status = 'won'; current.endedAt = now;
    showMessage('猜對了！答案就是 ' + current.answer + '，共猜了 ' + current.guesses.length + ' 次。', 'win');
    input.disabled = true; submit.disabled = true; restart.focus();
  } else {
    showMessage(parsed.value + '：' + r.a + 'A' + r.b + 'B');
    input.focus(); input.select();
  }
  renderHistory(current.id);
});
debugBox.addEventListener('change', updateDebug);
restart.addEventListener('click', () => newGame());
newGame(false);

</script>
</body>
</html>
